        <textarea id="markdown-source" style="display:none;"># Pushing Packets at the Speed of Light: Building a Custom eBPF XDP Firewall

If you've ever dealt with network security or traffic routing at an enterprise scale, you know that processing packets in the user-space is inherently slow. Every time a packet hits your server's network card, it has to traverse the entire Linux network stack, triggering interrupts, allocating sk_buff memory structures, and bouncing through various OS layers before your firewall application can even look at it.

When under a Distributed Denial of Service (DDoS) attack, this overhead is exactly what kills your server. The CPU maxes out just trying to *receive* the malicious packets. I decided to bypass this bottleneck entirely by building a high-performance firewall using **eBPF (Extended Berkeley Packet Filter)** and **XDP (eXpress Data Path)**.

## The Core Concept: Moving Security to the Hardware
Instead of waiting for the packet to travel up the OS stack, XDP allows us to attach a custom program directly to the Network Interface Card (NIC) driver. This means we can inspect, modify, drop, or forward packets the exact millisecond they hit the hardwareâ€”before the Linux kernel even knows they exist.

## Architecture &amp; Low-Level Implementation
Writing for the kernel requires strict safety guarantees. I wrote the core packet-filtering logic in **C**. This C code is compiled into eBPF bytecode using LLVM/Clang. Before the Linux kernel allows this bytecode to run, it passes it through the in-kernel eBPF verifier, which mathematically proves that the code will not crash the system or loop infinitely.

### 1. Packet Parsing
The eBPF program starts by parsing the raw packet bytes. It steps through the Ethernet header, validates the IP header (IPv4/IPv6), and extracts the TCP/UDP ports. All of this requires precise pointer arithmetic and bounds checking to satisfy the kernel verifier.

### 2. High-Speed Map Lookups
To determine if an IP is malicious, the program compares the source IPs against an eBPF Hash Map (a specialized key-value store shared between the kernel and user-space). The user-space control plane (written in Go/Python) constantly updates this map with threat intelligence feeds.

### 3. The Verdict
If the IP matches a known malicious signature, the program issues an XDP_DROP command. The NIC hardware simply discards the packet. The CPU doesn't allocate any memory, doesn't trigger any network stack processing, and essentially ignores the attack. If the packet is clean, it issues XDP_PASS, allowing it to proceed up the stack normally.

## Performance Benchmarks
The results of bypassing the kernel network stack were absolutely staggering. Compared to standard iptables or ufw rules, this eBPF firewall handled millions of packets per second with virtually zero CPU overhead. 

During simulated volumetric DDoS attacks, standard firewalls caused the server load to spike to 100%, eventually rendering the machine unresponsive. With the XDP firewall active, the server load remained below 5%, completely mitigating the attack at line-rate speeds.

eBPF is undeniably the future of Linux networking, observability, and security. Building this project was an incredibly challenging but rewarding dive into low-level kernel programming and network engineering.</textarea>
