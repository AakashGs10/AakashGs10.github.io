        <textarea id="markdown-source" style="display:none;">#  eBPF XDP Firewall

A high-performance, kernel-level network firewall built with **eBPF/XDP** (eXpress Data Path) that provides real-time packet inspection, automated threat intelligence ingestion, and full observability through Prometheus and Grafana.

&gt; **Drop malicious packets before they ever reach the kernel networking stack.**

---

##  Features

- ** XDP-Level Packet Processing** â€” Operates at the earliest point in the Linux networking stack for maximum throughput and minimum latency
- ** Deep Packet Inspection** â€” Parses Ethernet, IPv4, TCP, and UDP headers with full protocol awareness
- ** Live Threat Intelligence** â€” Automatically fetches and injects malicious IP blocklists from the [IPsum](https://github.com/stamparm/ipsum) threat feed
- ** IP Fragment Handling** â€” Tracks and blocks fragmented packets from known threats using an LRU hash map, preventing evasion via IP fragmentation
- ** Prometheus Metrics** â€” Exports real-time telemetry including packet counts and active threat signatures
- **Grafana Dashboards** â€” Full observability stack with pre-configured Docker Compose setup
- ** Ring Buffer Telemetry** â€” Streams per-packet metadata (src/dst IP, ports, protocol, size) from kernel to userspace via eBPF ring buffer

##  Prerequisites

- **Linux** with kernel â‰¥ 5.15 (eBPF &amp; XDP support required)
- **Go** â‰¥ 1.25
- **Clang/LLVM** (for compiling eBPF C programs)
- **libbpf** development headers
- **Docker &amp; Docker Compose** (for the observability stack)
- **Root privileges** (required for loading eBPF programs and attaching XDP hooks)

### Install Dependencies (Ubuntu/Debian)

```bash
# Build tools
sudo apt update
sudo apt install -y clang llvm libbpf-dev linux-headers-$(uname -r)

# Go (if not installed)
# See https://go.dev/doc/install

# Docker
sudo apt install -y docker.io docker-compose
```

##  Quick Start

### 1. Clone the Repository

```bash
git clone https://github.com/AakashGs10/ebpf-firewall.git
cd ebpf-firewall
```

### 2. Compile the eBPF Kernel Program

```bash
make
```

This compiles `xdp_telemetry.c` into `xdp_telemetry.o` using Clang with the BPF target:
```bash
clang -g -O2 -target bpf -D__TARGET_ARCH_x86 -I/usr/include/$(uname -m)-linux-gnu -c xdp_telemetry.c -o xdp_telemetry.o
```

### 3. Start the Observability Stack

```bash
docker-compose up -d
```

This launches:
- **Prometheus** on port `9090`
- **Grafana** on port `3000`

### 4. Run the Firewall

```bash
sudo go run main.go
```

Or build and run:
```bash
go build -o ebpf-firewall .
sudo ./ebpf-firewall
```

The control plane will:
1. Load the compiled eBPF program into the kernel
2. Attach the XDP hook to your network interface
3. Start the threat intelligence feed ingestion loop
4. Begin streaming packet telemetry from the ring buffer
5. Expose Prometheus metrics on `/metrics`

##  How It Works

### Kernel Space (eBPF/XDP)

The XDP program (`xdp_telemetry.c`) runs at the **NIC driver level** and performs:

1. **Header Parsing** â€” Validates and extracts Ethernet â†’ IPv4 â†’ TCP/UDP headers
2. **Blocklist Lookup** â€” Checks source IPs against a kernel-space hash map (`BPF_MAP_TYPE_HASH`) populated with known malicious IPs
3. **Fragment Tracking** â€” Uses an LRU hash map to track fragmented packet flows, blocking subsequent fragments from threats
4. **Telemetry Emission** â€” Sends packet metadata to userspace via a ring buffer (`BPF_MAP_TYPE_RINGBUF`)
5. **Verdict** â€” Returns `XDP_DROP` for blocked IPs or `XDP_PASS` for clean traffic

### User Space (Go Control Plane)

The Go application (`main.go`) handles:

1. **eBPF Lifecycle** â€” Loads the compiled eBPF object, attaches the XDP hook, and manages map references
2. **Threat Intelligence** â€” Periodically fetches the [IPsum](https://github.com/stamparm/ipsum) blocklist and injects up to 10,000 malicious IPs into the kernel hash map
3. **Telemetry Consumer** â€” Reads per-packet events from the ring buffer and logs them
4. **Metrics Export** â€” Exposes Prometheus counters and gauges for external scraping

## âš™ï¸ eBPF Maps

| Map | Type | Max Entries | Purpose |
|-----|------|-------------|---------|
| `ringbuf` | `BPF_MAP_TYPE_RINGBUF` | 256 KB | Stream packet telemetry to userspace |
| `blocklist` | `BPF_MAP_TYPE_HASH` | 10,000 | Store blocked IP addresses |
| `fragment_cache` | `BPF_MAP_TYPE_LRU_HASH` | 5,000 | Track fragmented flows from threats |

---

##  Threat Intelligence

The firewall automatically fetches live threat data from the [IPsum](https://github.com/stamparm/ipsum) project â€” a curated, daily-updated list of suspicious and malicious IP addresses sourced from 30+ threat intelligence feeds.

- **Feed URL**: `https://raw.githubusercontent.com/stamparm/ipsum/master/ipsum.txt`
- **Update Interval**: Periodic (configurable in source)
- **Max Entries**: 10,000 IPs per refresh cycle
- **Injection**: IPs are written directly into the kernel `blocklist` hash map
