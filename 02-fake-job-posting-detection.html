        <textarea id="markdown-source" style="display:none;"># Unmasking Scammers: Fake Job Posting Detection with Explainable AI

Finding a job is stressful enough without having to worry about scammers stealing your personal identity. While browsing job boards, I realized how difficult it can be to distinguish a legitimate remote job from a highly sophisticated phishing scam. 

To solve this, I built an **Explainable Machine Learning Framework** designed to analyze job postings and detect fraud.

## The Data and the Models
I utilized a comprehensive dataset of thousands of job postings, extracting features like the presence of a company logo, the structure of the description, the requested salary range, and specific keyword frequencies.

I trained several models to find the most accurate solution:
1. Logistic Regression (as a baseline)
2. Random Forest
3. **XGBoost** (which yielded the highest performance)

## The Importance of "Explainability" (SHAP)
A major problem with AI is the "black box" effect. If a model flags a job as fake, human moderators need to know *why*. 

To solve this, I integrated **SHAP (SHapley Additive exPlanations)**. Instead of just outputting "Fake: 95%", the dashboard visually breaks down exactly which features influenced the decision. For example, it might highlight that the absence of a company logo and the phrase "wire transfer" heavily contributed to the fraud score.

## The Frontend
I wrapped the entire system in an interactive **Streamlit** web application. Users can paste a job description URL into the dashboard and instantly receive a fraud probability score along with a visual SHAP breakdown. It's a highly practical tool with real-world applications in the HR tech space.</textarea>
