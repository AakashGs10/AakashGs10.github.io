        <textarea id="markdown-source" style="display:none;"># Unmasking Scammers: Fake Job Posting Detection with Explainable AI

Finding a job is stressful enough in today's highly competitive market without having to worry about scammers trying to steal your personal identity or financial information. While browsing various remote job boards, I realized just how difficult it can be to distinguish a legitimate employment opportunity from a highly sophisticated phishing scam. Scammers have become incredibly adept at mimicking corporate language and formatting.

To combat this growing issue, I built an **Explainable Machine Learning Framework** designed to automatically analyze job postings, detect fraudulent language, and protect applicants.

## The Data Engineering Process
Machine learning is only as good as the data it trains on. I utilized a comprehensive, imbalanced dataset containing thousands of real and fake job postings. 

The first major hurdle was feature engineering. I extracted both structured and unstructured data:
* **Categorical Features:** Presence of a company logo, whether the company profile is filled out, industry type, and required education.
* **Text Processing (NLP):** I used Natural Language Processing (TF-IDF vectorization) to analyze the actual text of the job description, the requirements, and the benefits sections. Fraudulent posts often use specific manipulative phrasing or exhibit unnatural keyword stuffing.

## Model Training and Selection
I trained and evaluated several models to find the most accurate solution:
1. **Logistic Regression:** Used as a baseline for text classification.
2. **Random Forest:** To handle the complex non-linear relationships between the categorical features.
3. **XGBoost (Extreme Gradient Boosting):** This model ultimately yielded the highest performance, easily handling the highly imbalanced nature of the dataset (where real jobs vastly outnumber fake ones).

## The Critical Importance of "Explainability" (SHAP)
A major problem with modern AI is the "black box" effect. If an AI model flags a job as fake, human moderators or applicants need to know *why*. You cannot simply ban a company's account based on a raw percentage score without justification.

To solve this, I deeply integrated **SHAP (SHapley Additive exPlanations)**. SHAP values use game theory to explain the output of any machine learning model. Instead of just outputting "Fraud Probability: 95%", the dashboard visually breaks down exactly which features influenced the decision. 

For example, the SHAP visualization might highlight that the absence of a company logo (+20% fraud risk), the phrase "wire transfer required" (+40% fraud risk), and a lack of required education (+10% fraud risk) pushed the post into the danger zone.

## The Interactive Frontend
I wrapped the entire AI backend into an interactive **Streamlit** web application. Users can paste a job description URL or raw text into the dashboard and instantly receive a fraud probability score along with the visual SHAP breakdown. 

Building this taught me that high accuracy isn't enough in the real world; users need to trust and understand the AI's reasoning. This framework provides a highly practical tool with real-world applications in the HR tech and cybersecurity space.</textarea>
