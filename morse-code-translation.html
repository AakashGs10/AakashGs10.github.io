
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morse Code Translator - Aakash G S</title>
    {adsense_code}
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Inter', sans-serif; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        
        /* Markdown styling inside Tailwind prose */
        .markdown-body h1, .markdown-body h2, .markdown-body h3 { color: #e2e8f0; margin-top: 1.5em; margin-bottom: 0.5em; font-weight: bold; border-bottom: 1px solid #334155; padding-bottom: 0.3em; }
        .markdown-body h1 { font-size: 2.25rem; border-bottom: 2px solid #38bdf8; padding-bottom: 0.5rem; }
        .markdown-body h2 { font-size: 1.75rem; }
        .markdown-body h3 { font-size: 1.25rem; }
        .markdown-body p { margin-bottom: 1em; line-height: 1.7; font-size: 1.1rem; }
        .markdown-body ul { list-style-type: disc; padding-left: 2em; margin-bottom: 1em; font-size: 1.1rem; }
        .markdown-body ol { list-style-type: decimal; padding-left: 2em; margin-bottom: 1em; font-size: 1.1rem; }
        .markdown-body a { color: #38bdf8; text-decoration: underline; }
        .markdown-body code { background-color: #1e293b; padding: 0.2em 0.4em; border-radius: 3px; font-family: monospace; color: #fb7185; }
        .markdown-body pre { background-color: #1e293b; padding: 1.5em; border-radius: 8px; overflow-x: auto; margin-bottom: 1.5em; border: 1px solid #334155; }
        .markdown-body pre code { background-color: transparent; padding: 0; color: #e2e8f0; font-size: 0.9rem; }
        .markdown-body blockquote { border-left: 4px solid #38bdf8; padding-left: 1.5em; color: #94a3b8; font-style: italic; background-color: rgba(56, 189, 248, 0.05); padding: 1em; border-radius: 4px; }
        .markdown-body table { width: 100%; border-collapse: collapse; margin-bottom: 1.5em; }
        .markdown-body th, .markdown-body td { border: 1px solid #334155; padding: 0.75em; text-align: left; }
        .markdown-body th { background-color: #1e293b; color: #38bdf8; font-weight: 600; }
        .markdown-body tr:nth-child(even) { background-color: rgba(255,255,255,0.02); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-6">
    <nav class="w-full max-w-5xl mb-8 flex justify-between items-center">
        <a href="index.html" class="text-blue-400 hover:text-blue-300 flex items-center gap-2 transition-colors font-semibold">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            Back to Projects
        </a>
        <div class="text-slate-400 font-medium">Aakash G S</div>
    </nav>
    
    <main class="w-full max-w-5xl glass-panel rounded-2xl p-8 shadow-2xl mb-12">
        <header class="mb-10 border-b border-slate-700 pb-6 flex justify-between items-end">
            <div>
                <p class="text-emerald-400 font-medium mb-2 tracking-widest text-sm uppercase">Official Documentation</p>
                <h1 class="text-5xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-emerald-400 mb-0">Morse Code Translator</h1>
            </div>
            <a href="https://github.com/AakashGs10/Morse_code_translation" target="_blank" class="px-5 py-2.5 bg-slate-800 hover:bg-slate-700 border border-slate-600 text-white rounded-lg font-medium transition-all shadow hover:shadow-blue-500/20 flex items-center gap-2">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" clip-rule="evenodd"></path></svg>
                GitHub
            </a>
        </header>
        
        <textarea id="markdown-source" style="display:none;">No README found for {repo_path}/{file_path}</textarea>
        
        <article id="content" class="markdown-body text-slate-300 w-full max-w-full">
        </article>
        
        <script>
            const rawMarkdown = document.getElementById('markdown-source').value;
            // Decode HTML entities safely in case any existed in code blocks
            const txt = document.createElement("textarea");
            txt.innerHTML = rawMarkdown;
            document.getElementById('content').innerHTML = marked.parse(txt.value);
        </script>
        
    </main>
    <footer class="mt-auto pb-6 text-slate-500 text-sm">
        &copy; 2026 Aakash G S. All rights reserved.
    </footer>
</body>
</html>
